name: Build Mcberdasi Addon

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract source ZIP
        run: |
          unzip -o McberdasiAddon-v2-source.zip -d project

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build addon
        run: gradle -p project/McberdasiAddon build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: McberdasiAddon-JAR
          path: project/McberdasiAddon/build/libs/*.jar
          if-no-files-found: error￼Enter
